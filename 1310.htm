        function checkNumber(num) {
  // Check if the number is greater than 0
  if (num > 0) {
    console.log(`${num} is a positive number.`);
  }
  // If not positive, check if it's less than 0
  else if (num < 0) {
    console.log(`${num} is a negative number.`);
  }
  // If it's neither positive nor negative, it must be zero
  else {
    console.log(`${num} is zero.`);
  }
}


// --- Example Usage ---

checkNumber(15);   // Output: 15 is a positive number.
checkNumber(-7);   // Output: -7 is a negative number.
checkNumber(0);    // Output: 0 is zero.
        /**
         * 
         * 
 * Prints the name of the day based on a number from 1 to 7.
 * @param {number} day - A number representing the day of the week (1=Monday, 7=Sunday).
 */
function printDayOfWeek(day) {
  // The switch statement evaluates the 'day' variable
  switch (day) {
    case 1:
      console.log("Monday");
      break; // Stops execution from falling through to the next case
    case 2:
      console.log("Tuesday");
      break;
    case 3:
      console.log("Wednesday");
      break;
    case 4:
      console.log("Thursday");
      break;
    case 5:
      console.log("Friday");
      break;
    case 6:
      console.log("Saturday");
      break;
    case 7:
      console.log("Sunday");
      break;
    default:
      // This block runs if 'day' does not match any of the cases above
      console.log("Invalid day");
  }
}

// --- Example Usage ---

let day = 5;
printDayOfWeek(day); // Output: Friday

day = 1;
printDayOfWeek(day); // Output: Monday

day = 9;
printDayOfWeek(day); // Output: Invalid day
