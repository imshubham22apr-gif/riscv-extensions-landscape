<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
    <STYle>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        header{
            display: flex;
            width: 100%;
            height: 150px;
            background-color: rgb(0, 0, 0);
            color: white;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            align-items: center;

        }

        nav{
            width: 100%;
            text-align: right;
            margin-top: 10px;
            color: white;
            justify-content: space-evenly;
        }

        a{
            text-decoration: none;
            color: white;
            margin: 10px;
            font-size: 1rem;
            padding: 20px;

        }
        
        /* span is inline element */
        span{ 
            align-items: right;
            background-color: white;
            height: 2px;
            width: 20px;
            display: none;
            /* visibility: hidden; */
            /* display: none .... hides and clears spaces */
            /* visibility: hidden...hides but space still remains */
        }


        @media screen and (max-width: 1000px) {
            span{
                display: block;
            }
            nav{
                position: absolute;
                width: 100%;
                background-color: rgb(0, 0, 0);
                display: none;
                flex-direction: column;
            }
            }   
            label{
                display: block;
            }

        

            


    </STYle>
</head>
<body>
    <header>
        <h1>Tere bhai ka  WEBSITE  </h1>
        <label for="nav-btn">
            <span></span><br><span></span><br><span></span>
        </label>
        <NAV>
            <a href="">HOME</a>
            <a href="">ABOUT</a>
            <a href="">CONTACT</a>
            <a href="">SERVICES</a>
        </NAV>
    

    </header>
    <h1 style="text-align: center;">
        ayye mara jayega re 😛🤙
    </h1>
</body>
</html>
