<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .road{
            width: 100px;
            height: 100px;
            background-color: black;
            position: relative;
        }
        .car{
            width: 50px;
            height: 20px;
            background-color: red;
            position: absolute;
            left: 25px;
            top: 10px;
        }
        .wheel_left and .wheel_right {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: black;
            position: absolute;
        }
        
    </style>
</head>
<body>
    <div class="road">
        <div class="car">
            <div class="wheel_left"></div>
            <div class="wheel_right">

            </div>
        </div>
    </div>   
    
</body>
</html>
