

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 200px;
            height: 200px;
            background-color: rgb(144, 163, 251);

        }
        .container>div{
            height: 100%;
            width: 100%;

        }
        .card1{
            background-color: rgb(255, 0, 0);
            position: absolute;
            top: 100%;
            left: 100%;
        }
        .card2{
            background-color: rgb(0, 255, 0);
            position: absolute;
            top: 0%;
            left: 100%;
        }
        .card3{
            background-color: rgb(0, 0, 255);
            position: absolute;
            top: 100%;
            left: 0%;

        }
        .card4{
            background-color: rgb(212, 212, 1);
            position: absolute;
            top: 0%;
            left: 0%;

        }
        


        
    </style>
</head>
<body>
    <div class="container">
        <div class="card1">card1</div>
        <div class="card2">card2</div>
        <div class="card3">card3</div>
        <div class="card4">card4</div>
    </div>
</body>
</html>
