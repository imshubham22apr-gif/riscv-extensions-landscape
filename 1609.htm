<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            display: flex;
            flex-direction: row;
            @media {
                max-width: fit-content;
            }
        } 

        .box1{
            width: 200px;
            height: 200px;
            background-color: rgb(255, 0, 0);
            margin: 10px;
        }.box2{
            width: 200px;
            height: 200px;
            background-color: rgb(13, 244, 17);
            margin: 10px;
        }.box3{
            width: 200px;
            height: 200px;
            background-color: rgb(238, 255, 0);
            margin: 10px;
        }.box4{
            width: 200px;
            height: 200px;
            background-color: rgb(0, 42, 255);
            margin: 10px;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
    </div>
</body>
</html>
